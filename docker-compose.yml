version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "7883:7883/udp"
      - "7884:7884/udp"
      - "7885:7885/udp"
    environment:
      - LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_REDIS_ADDRESS=redis:6379
    depends_on:
      - redis
    networks:
      - livekit-network

  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    ports:
      - "6379:6379"
    networks:
      - livekit-network
  
  srs:
    image: ossrs/srs:latest
    container_name: srs_server
    ports:
      - "1935:1935" # RTMP
      - "1985:1985" # HTTP API
      - "8080:8080" # HLS/HTTP
    volumes:
      # 1. Persist Configuration: So your custom settings survive restarts
      - ./srs/conf:/usr/local/srs/conf
      # 2. Persist Output: So your HLS files (the actual broadcast) survive
      - ./srs/data:/usr/local/srs/objs/nginx/html
      # 3. Persist Logs: Optional, but helpful for debugging
      - ./srs/logs:/usr/local/srs/objs
    restart: always

networks:
  livekit-network:
    driver: bridge
